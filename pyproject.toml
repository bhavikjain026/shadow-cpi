[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timelock"
version = "0.1.0"
description = "Time-locked Tavily search: a search that cannot see past a cutoff date. Standard library only."
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]                       # only for timelock/langchain.py

[tool.setuptools]
packages = ["timelock"]
